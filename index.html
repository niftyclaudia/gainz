<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipes</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='8' width='26' height='20' rx='2' fill='%23ddb04a' stroke='%232b1e16' stroke-width='2'/%3E%3Ccircle cx='11' cy='8' r='3' fill='none' stroke='%232b1e16' stroke-width='2'/%3E%3Ccircle cx='21' cy='8' r='3' fill='none' stroke='%232b1e16' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app/styles.css">
  <script type="module" src="app/app.js"></script>
</head>
<body>
  <main class="table">
    <!-- Closed: the ring-bound stand with the "Recipes" card -->
    <section class="closed" id="closed" hidden aria-label="Recipe book, closed">
      <a class="stand" href="#/contents" aria-label="Open the recipe book">
        <span class="board">
          <span class="pocket-card" aria-hidden="true">For Good Measure</span>
          <span class="pocket" aria-hidden="true"></span>
          <span class="card-stack">
            <span class="card-tabs" aria-hidden="true">
              <span style="--tab: var(--tab-breakfast)">Breakfast</span>
              <span style="--tab: var(--tab-lunch)">Lunch</span>
              <span style="--tab: var(--tab-dinner); --tab-text: var(--paper)">Dinner</span>
              <span style="--tab: var(--tab-snacks)">Snacks</span>
            </span>
            <span class="cover-card"><span class="cover-title">Recipes</span></span>
          </span>
          <span class="rings" aria-hidden="true"><span class="ring"></span><span class="ring"></span></span>
        </span>
        <span class="pedestal" aria-hidden="true"></span>
      </a>
      <p class="hint">Click the card to open</p>
    </section>

    <!-- Open: two-page spread with divider tabs along the bottom -->
    <section class="book" id="book" hidden aria-label="Recipe book">
      <div class="spread" id="spread">
        <article class="page page-left" id="page-left"></article>
        <article class="page page-right" id="page-right"></article>
        <div class="binding" aria-hidden="true"><span class="ring"></span><span class="ring"></span><span class="ring"></span></div>
      </div>
      <nav class="tabs" id="tabs" aria-label="Sections"></nav>
      <a class="close-book" href="#/">Close the book</a>
    </section>
  </main>
</body>
</html>
